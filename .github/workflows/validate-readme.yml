name: Validate README

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  markers:
    name: README markers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # No token and no API calls: this only reads README.md.
      - run: python3 scripts/update_readme.py --check

  tests:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest versions we support. The script uses only the standard library.
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
