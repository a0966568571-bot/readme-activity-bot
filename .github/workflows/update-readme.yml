name: Update README

on:
  schedule:
    # TEMPORARY: every 15 minutes to collect run data for #2.
    # Off the hour on purpose: scheduled runs at :00 are the most delayed.
    # #2 reverts this to once a day.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      simulate_status:
        description: "Fake HTTP status for the first N requests (0 = off). 429/503 are retried, 403 is not."
        type: choice
        options: ["0", "429", "503", "403"]
        default: "0"
      simulate_count:
        description: "How many requests should fail"
        type: string
        default: "0"
  push:
    branches: [main]
    # The bot only changes README.md, so its own push never starts another run.
    paths-ignore:
      - "README.md"

# GITHUB_TOKEN gets read-only access. The only write access is the repo-scoped
# REPO_TOKEN (Contents: read and write on this one repository).
permissions:
  contents: read

# Two runs at once could both try to push. Queue them instead.
concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_TOKEN }}

      - name: Restore ETag cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: etag-cache-${{ github.run_id }}
          restore-keys: etag-cache-

      - name: Update README
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_TOKEN }}
          # Tunable in Settings > Secrets and variables > Actions > Variables, no code change needed.
          MAX_RETRIES: ${{ vars.MAX_RETRIES || '4' }}
          BACKOFF_BASE: ${{ vars.BACKOFF_BASE || '2' }}
          MAX_WAIT: ${{ vars.MAX_WAIT || '60' }}
          SIMULATE_STATUS: ${{ inputs.simulate_status || '0' }}
          SIMULATE_COUNT: ${{ inputs.simulate_count || '0' }}
        # Only main may write. A manual run on any other branch is a dry run.
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            python3 scripts/update_readme.py
          else
            python3 scripts/update_readme.py --dry-run
          fi

      - name: Commit and push if changed
        if: steps.update.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(readme): update recent activity [skip ci]"
          git pull --rebase --quiet
          git push

      - name: Upload run metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-${{ github.run_id }}
          path: metrics.json
          retention-days: 30
          if-no-files-found: ignore
