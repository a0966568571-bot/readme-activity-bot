name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: Make one stage's smoke test fail, to demo the rollback
        type: choice
        options: [none, dev, staging, production]
        default: none

# Default for every job: read only. A job that needs more asks for it itself.
permissions:
  contents: read

# One release train at a time. A run waiting for production approval holds the
# lock, so a newer push waits instead of racing it for the next version number.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.17.0
      - run: ruff check scripts tests

  test:
    name: test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # all tags, so next_version.py can see what is already released

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # VERSION holds MAJOR.MINOR; the patch number is bumped from the existing tags.
      - name: Version
        id: version
        run: python scripts/next_version.py

      - name: Build
        run: |
          python -m compileall -q scripts
          printf 'version=%s\ncommit=%s\nrun=%s\n' \
            "${{ steps.version.outputs.version }}" "$GITHUB_SHA" "$GITHUB_RUN_ID" > BUILD_INFO
          zip -r build.zip scripts README.md LICENSE VERSION BUILD_INFO

      - uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: build.zip
          retention-days: 30

      - run: echo "### Build ${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"

  deploy-dev:
    needs: build
    permissions:
      contents: write
    uses: ./.github/workflows/release-stage.yml
    with:
      environment: dev
      version: ${{ needs.build.outputs.version }}
      simulate_failure: ${{ inputs.simulate_failure == 'dev' }}

  # Staging and production release the same build-artifact as dev.
  deploy-staging:
    needs: build
    permissions:
      contents: write
    uses: ./.github/workflows/release-stage.yml
    with:
      environment: staging
      version: ${{ needs.build.outputs.version }}
      simulate_failure: ${{ inputs.simulate_failure == 'staging' }}

  # The release-notes agent. It reads the changes since the last prod- tag and drafts
  # notes for the production reviewer. It runs on GitHub Models through
  # scripts/release_notes_agent.py. Guardrails:
  # - least privilege: contents: read and models: read. The only credential is this
  #   job's short-lived GITHUB_TOKEN; there is no long-lived API key to leak
  # - the model never sees the token; it can only call four read-only tools that the
  #   script implements and checks (git_log, git_diff_stat, git_show, read_file)
  # - its own environment (ai-review, main only) holds the model choice as a variable
  # - it returns JSON; our script renders it, so the model never writes the notes file
  # - it cannot approve anything: production still waits for a human reviewer
  release-notes-agent:
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ai-review
    continue-on-error: true   # if the agent fails, the reviewer still gets the commit list
    permissions:
      contents: read
      models: read   # call GitHub Models with GITHUB_TOKEN
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false   # no GitHub token left in .git/config

      - name: Find changes since last production release
        id: range
        run: |
          prev=$(git tag --list 'prod-v*' --sort=-v:refname | head -1)
          range="${prev:+$prev..}$GITHUB_SHA"
          echo "prev=$prev" >> "$GITHUB_OUTPUT"
          echo "range=$range" >> "$GITHUB_OUTPUT"
          git log --no-merges --format='%h %s' "$range" > commits.txt
          echo "Range: $range ($(wc -l < commits.txt) commits)"

      # Each tool call is printed here and saved to agent-trace.jsonl.
      - name: Run release-notes agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL: ${{ vars.AI_MODEL }}
        run: |
          python3 scripts/release_notes_agent.py \
            --version "$VERSION" \
            --prev-tag "${{ steps.range.outputs.prev }}" \
            --range "${{ steps.range.outputs.range }}"

      - name: Render notes for the reviewer
        if: always()
        run: |
          AGENT_OUTPUT="$(cat agent-output.json 2>/dev/null || true)" \
            python3 scripts/render_release_notes.py "$VERSION" "${{ steps.range.outputs.prev }}" commits.txt release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      # Kept 90 days so the draft the reviewer saw can be compared with what shipped.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-release-notes
          path: |
            release-notes.md
            agent-output.json
            agent-trace.jsonl
            commits.txt
          retention-days: 90
          if-no-files-found: warn

  # Runs only after staging succeeds. The production environment has a required
  # reviewer, so this waits in "Waiting for review" until someone approves it.
  # The reviewer reads the agent's notes (run summary) before approving.
  deploy-production:
    needs: [build, deploy-staging, release-notes-agent]
    if: ${{ !cancelled() && needs.deploy-staging.result == 'success' }}
    permissions:
      contents: write
    uses: ./.github/workflows/release-stage.yml
    with:
      environment: production
      version: ${{ needs.build.outputs.version }}
      prerelease: false
      simulate_failure: ${{ inputs.simulate_failure == 'production' }}
      notes_artifact: ai-release-notes

  # Post the outcome on the "Release log" issue, whether production shipped or not.
  notify:
    needs: [build, deploy-staging, deploy-production]
    if: always() && needs.build.result == 'success' && vars.RELEASE_LOG_ISSUE != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write    # comment on the release-log issue
      actions: read    # read who approved the production deployment
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
      STAGING: ${{ needs.deploy-staging.result }}
      PRODUCTION: ${{ needs.deploy-production.result }}
      ISSUE: ${{ vars.RELEASE_LOG_ISSUE }}
    steps:
      - name: Comment on release log
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          approval=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" \
            --jq '[.[] | select(.user.login != "github-actions[bot]")
                   | select(any(.environments[]; .name == "production"))
                   | "\(.user.login) (\(.state)): \(if (.comment // "") == "" then "no comment" else .comment end)"]
                   | join("; ")')
          if [ "$PRODUCTION" = "success" ]; then
            head="Released prod-v$VERSION"
            link="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/prod-v$VERSION"
          else
            head="Production not released for $VERSION (production: $PRODUCTION, staging: $STAGING)"
            link="$run_url"
          fi
          gh issue comment "$ISSUE" --body "**$head**

          - Link: $link
          - Production review: ${approval:-none}
          - Commit: $GITHUB_SHA
          - Run: $run_url"
