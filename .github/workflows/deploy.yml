name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: Make one stage fail on purpose (smoke test rollback, or the prod test gate)
        type: choice
        options: [none, dev, staging, prod-tests, production]
        default: none

# Default for every job: read only. A job that needs more asks for it itself.
permissions:
  contents: read

# One release train at a time. A run waiting for production approval holds the
# lock, so a newer push waits instead of racing it for the next version number.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.17.0
      - run: ruff check scripts tests

  build:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # all tags, so next_version.py can see what is already released

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # VERSION holds MAJOR.MINOR; the patch number is bumped from the existing tags.
      - name: Version
        id: version
        run: python scripts/next_version.py

      # compileall is only a syntax check. Its __pycache__ is left out of the zip:
      # the integration tests found .pyc files for Python 3.13 shipping in every release.
      - name: Build
        run: |
          python -m compileall -q scripts
          printf 'version=%s\ncommit=%s\nrun=%s\n' \
            "${{ steps.version.outputs.version }}" "$GITHUB_SHA" "$GITHUB_RUN_ID" > BUILD_INFO
          zip -r build.zip scripts README.md LICENSE VERSION BUILD_INFO -x '*__pycache__*'
          unzip -l build.zip

      - uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: build.zip
          retention-days: 30

      - run: echo "### Build ${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"

  # Test stage 1: unit tests on the source. Python 3.9 and 3.13 on Linux, plus 3.13
  # on macOS. Every run uploads its JUnit XML and coverage report.
  test-unit:
    name: unit tests (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false   # finish every run, so the log shows every failure
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-test.txt
      - name: Unit tests
        run: |
          echo "Running unit tests on ${{ matrix.os }}, Python ${{ matrix.python }}..."
          pytest tests --ignore=tests/integration -v --junitxml=reports/unit.xml \
            --cov --cov-report=term --cov-report=xml:reports/coverage.xml --cov-report=html:reports/htmlcov \
            || { echo "::error::Unit tests failed on ${{ matrix.os }}, Python ${{ matrix.python }}"; exit 1; }
      - name: Coverage numbers
        if: ${{ !cancelled() }}
        run: |
          coverage report --format=total > reports/coverage-total.txt
          coverage report --format=markdown > reports/coverage.md
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: unit-results-${{ matrix.os }}-py${{ matrix.python }}
          path: reports/
          retention-days: 30

  # Coverage gate. Below vars.COVERAGE_MIN (default 90) the releases are skipped:
  # the run stays green, but nothing ships until tests are added.
  coverage-gate:
    needs: test-unit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      percent: ${{ steps.gate.outputs.percent }}
      ok: ${{ steps.gate.outputs.ok }}
    env:
      MIN: ${{ vars.COVERAGE_MIN || '90' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: unit-results-ubuntu-latest-py3.13
          path: reports
      - name: Compare coverage with the minimum
        id: gate
        run: |
          pct=$(cat reports/coverage-total.txt)
          ok=$(python3 -c 'import sys; print("true" if float(sys.argv[1]) >= float(sys.argv[2]) else "false")' "$pct" "$MIN")
          echo "percent=$pct" >> "$GITHUB_OUTPUT"
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "Coverage $pct%, minimum $MIN%, releases allowed: $ok"
          { echo "### Coverage $pct% (minimum $MIN%)"; echo; cat reports/coverage.md; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$ok" != "true" ]; then
            echo "::warning::Coverage $pct% is below the $MIN% minimum. Releases will be skipped."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            reports/htmlcov
            reports/coverage.xml
            reports/coverage.md
          retention-days: 30

  # Test stage 2: integration tests. They unzip build.zip and run the code that will ship.
  test-integration:
    needs: [build, test-unit]
    uses: ./.github/workflows/integration-tests.yml
    with:
      test_env: staging

  # Releases wait for both test stages and the coverage gate. If any test fails,
  # or coverage is too low, these jobs are skipped. Only main releases: on other
  # branches the pipeline stops after the tests.
  deploy-dev:
    needs: [build, test-unit, test-integration, coverage-gate]
    if: needs.coverage-gate.outputs.ok == 'true' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/release-stage.yml
    with:
      environment: dev
      version: ${{ needs.build.outputs.version }}
      simulate_failure: ${{ inputs.simulate_failure == 'dev' }}

  # Staging and production release the same build-artifact as dev.
  deploy-staging:
    needs: [build, test-unit, test-integration, coverage-gate]
    if: needs.coverage-gate.outputs.ok == 'true' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/release-stage.yml
    with:
      environment: staging
      version: ${{ needs.build.outputs.version }}
      simulate_failure: ${{ inputs.simulate_failure == 'staging' }}

  # Test stage 3, the gate before production: the same integration tests with
  # TEST_ENV=prod, which also downloads the staging release and requires our zip
  # to be byte for byte the one staging shipped. Production review is only
  # requested after this passes.
  test-prod:
    needs: [build, deploy-staging]
    uses: ./.github/workflows/integration-tests.yml
    with:
      test_env: prod
      staging_tag: ${{ needs.deploy-staging.outputs.tag }}
      simulate_mismatch: ${{ inputs.simulate_failure == 'prod-tests' }}

  # The release-notes agent. It reads the changes since the last prod- tag and drafts
  # notes for the production reviewer, using GitHub Copilot CLI. Guardrails:
  # - its own environment (ai-review, main only) holds COPILOT_PAT as an environment
  #   secret: a fine-grained PAT whose only permission is "Copilot Requests"
  # - the job token is contents: read, and the checkout does not keep it on disk
  # - the agent may only run git log/diff/show; writing files and git push are denied
  # - it returns JSON; our script renders it, so the agent never writes the notes file
  # - it cannot approve anything: production still waits for a human reviewer
  release-notes-agent:
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ai-review
    continue-on-error: true   # if the agent fails, the reviewer still gets the commit list
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false   # no GitHub token left in .git/config

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Copilot CLI
        run: npm install -g @github/copilot@1.0.96   # pinned: a new CLI release should be a reviewed change

      - name: Find changes since last production release
        id: range
        run: |
          prev=$(git tag --list 'prod-v*' --sort=-v:refname | head -1)
          range="${prev:+$prev..}$GITHUB_SHA"
          echo "prev=$prev" >> "$GITHUB_OUTPUT"
          git log --no-merges --format='%h %s' "$range" > commits.txt
          sed -e "s|{{VERSION}}|$VERSION|" -e "s|{{PREV_TAG}}|${prev:-none}|" -e "s|{{RANGE}}|$range|" \
            .github/agent/release-notes-prompt.md > "$RUNNER_TEMP/prompt.md"
          echo "Range: $range ($(wc -l < commits.txt) commits)"

      - name: Run release-notes agent
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
          MODEL: ${{ vars.AI_MODEL }}
        run: |
          copilot -p "$(cat "$RUNNER_TEMP/prompt.md")" -s --no-ask-user \
            ${MODEL:+--model "$MODEL"} \
            --allow-tool 'shell(git log:*)' \
            --allow-tool 'shell(git diff:*)' \
            --allow-tool 'shell(git show:*)' \
            --deny-tool 'write' \
            --deny-tool 'shell(git push:*)' \
            | tee agent-response.txt

      - name: Render notes for the reviewer
        if: always()
        run: |
          AGENT_OUTPUT="$(cat agent-response.txt 2>/dev/null || true)" \
            python3 scripts/render_release_notes.py "$VERSION" "${{ steps.range.outputs.prev }}" commits.txt release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
          cat release-notes.md   # the run summary page only shows this after the whole run ends

      # Kept 90 days so the draft the reviewer saw can be compared with what shipped.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-release-notes
          path: |
            release-notes.md
            agent-response.txt
            commits.txt
          retention-days: 90
          if-no-files-found: warn

  # Job summaries only appear once the whole run has finished, but production is
  # still waiting then. So post the draft on the Release log issue, where the
  # reviewer sees it before approving. This job, not the agent, holds issues: write.
  share-release-notes:
    needs: [build, deploy-staging, test-prod, release-notes-agent]
    # Same condition as deploy-production: only post when production will ask for review.
    if: ${{ !cancelled() && needs.deploy-staging.result == 'success' && needs.test-prod.result == 'success' && vars.RELEASE_LOG_ISSUE != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ai-release-notes

      - name: Comment draft on release log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ vars.RELEASE_LOG_ISSUE }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo "**Waiting for production review: $VERSION** ([run]($run_url))"
            echo
            if [ -f release-notes.md ]; then cat release-notes.md; else echo "No AI draft was produced."; fi
          } > comment.md
          gh issue comment "$ISSUE" --body-file comment.md

  # Runs only after staging and the prod tests succeed. The production environment has a required
  # reviewer, so this waits in "Waiting for review" until someone approves it.
  # The reviewer reads the agent's notes (run summary) before approving.
  deploy-production:
    needs: [build, deploy-staging, test-prod, release-notes-agent]
    if: ${{ !cancelled() && needs.deploy-staging.result == 'success' && needs.test-prod.result == 'success' }}
    permissions:
      contents: write
    uses: ./.github/workflows/release-stage.yml
    with:
      environment: production
      version: ${{ needs.build.outputs.version }}
      prerelease: false
      simulate_failure: ${{ inputs.simulate_failure == 'production' }}
      notes_artifact: ai-release-notes

  # One report for all test jobs: a table in the run summary, the README badges
  # (main only), and a "Tests failing on <branch>" issue that is opened when tests
  # fail and closed by the first run where they pass again.
  test-report:
    needs: [build, test-unit, coverage-gate, test-integration, test-prod]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # push badge files to the badges branch
      issues: write     # open, comment on or close the test-failure issue
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      UNIT: ${{ needs.test-unit.result }}
      INTEGRATION: ${{ needs.test-integration.result }}
      PROD_TESTS: ${{ needs.test-prod.result }}
      COVERAGE: ${{ needs.coverage-gate.outputs.percent }}
      COVERAGE_OK: ${{ needs.coverage-gate.outputs.ok }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ci
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: "*-results-*"
          path: results

      - name: Test report
        run: |
          python3 ci/junit_summary.py results --json totals.json --badge-dir badges | tee report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open or close the test-failure issue
        run: |
          title="Tests failing on $GITHUB_REF_NAME"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh label create test-failure --color d73a4a --description "Opened by the pipeline when tests fail" --force
          number=$(gh issue list --state open --label test-failure --limit 100 --json number,title \
            | jq -r --arg t "$title" 'map(select(.title == $t)) | .[0].number // empty')
          failed=false
          for r in "$UNIT" "$INTEGRATION" "$PROD_TESTS"; do
            if [ "$r" = "failure" ]; then failed=true; fi
          done
          if [ "$failed" = "true" ]; then
            {
              echo "Tests failed on \`$GITHUB_REF_NAME\` at $GITHUB_SHA."
              echo
              echo "- Run: $run_url"
              echo "- Stages: unit $UNIT, integration (staging) $INTEGRATION, integration (prod) $PROD_TESTS"
              echo
              cat report.md
            } > body.md
            if [ -n "$number" ]; then
              gh issue comment "$number" --body-file body.md
            else
              gh issue create --title "$title" --label test-failure --body-file body.md
            fi
          elif [ -n "$number" ] && [ "$UNIT" = "success" ] && [ "$INTEGRATION" = "success" ]; then
            gh issue close "$number" --comment "Tests pass again on \`$GITHUB_REF_NAME\` at $GITHUB_SHA: $run_url"
          else
            echo "Nothing to open or close."
          fi

      # shields.io reads these JSON files from the badges branch (one commit, force-pushed).
      - name: Publish badges
        if: github.ref == 'refs/heads/main'
        run: |
          if [ "$COVERAGE_OK" = "true" ]; then color=brightgreen; elif [ -n "$COVERAGE" ]; then color=red; else color=lightgrey; fi
          message="${COVERAGE:+$COVERAGE%}"
          printf '{"schemaVersion":1,"label":"coverage","message":"%s","color":"%s"}\n' \
            "${message:-unknown}" "$color" > badges/coverage.json
          cat badges/*.json
          cd badges
          git init -q -b badges
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Badges for $GITHUB_SHA"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

  # Post the outcome on the "Release log" issue, whether production shipped or not.
  notify:
    needs: [build, test-unit, coverage-gate, test-integration, deploy-staging, test-prod, deploy-production]
    if: always() && needs.build.result == 'success' && github.ref == 'refs/heads/main' && vars.RELEASE_LOG_ISSUE != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write    # comment on the release-log issue
      actions: read    # read who approved the production deployment
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
      UNIT: ${{ needs.test-unit.result }}
      INTEGRATION: ${{ needs.test-integration.result }}
      PROD_TESTS: ${{ needs.test-prod.result }}
      COVERAGE: ${{ needs.coverage-gate.outputs.percent }}
      COVERAGE_OK: ${{ needs.coverage-gate.outputs.ok }}
      COVERAGE_MIN: ${{ vars.COVERAGE_MIN || '90' }}
      STAGING: ${{ needs.deploy-staging.result }}
      PRODUCTION: ${{ needs.deploy-production.result }}
      ISSUE: ${{ vars.RELEASE_LOG_ISSUE }}
    steps:
      - name: Comment on release log
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          approval=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" \
            --jq '[.[] | select(.user.login != "github-actions[bot]")
                   | select(any(.environments[]; .name == "production"))
                   | "\(.user.login) (\(.state)): \(if (.comment // "") == "" then "no comment" else .comment end)"]
                   | join("; ")')
          tests="unit $UNIT, integration (staging) $INTEGRATION, integration (prod) $PROD_TESTS, coverage ${COVERAGE:-?}%"
          if [ "$UNIT" != "success" ] || [ "$INTEGRATION" != "success" ]; then
            head="Tests failed for $VERSION: nothing was released"
            link="$run_url"
          elif [ "$COVERAGE_OK" != "true" ]; then
            head="Coverage ${COVERAGE}% is below the ${COVERAGE_MIN}% minimum for $VERSION: nothing was released"
            link="$run_url"
          elif [ "$PRODUCTION" = "success" ]; then
            head="Released prod-v$VERSION"
            link="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/prod-v$VERSION"
          else
            head="Production not released for $VERSION (production: $PRODUCTION, prod tests: $PROD_TESTS, staging: $STAGING)"
            link="$run_url"
          fi
          gh issue comment "$ISSUE" --body "**$head**

          - Link: $link
          - Tests: $tests
          - Production review: ${approval:-none}
          - Commit: $GITHUB_SHA
          - Run: $run_url"
