name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Default for every job: read only. A job that needs more asks for it itself.
permissions:
  contents: read

# Two pushes close together should not race to create releases.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Python has no compile step, so "build" means: tests pass and every file compiles.
      - name: Test
        run: |
          python -m unittest discover -s tests
          python -m compileall -q scripts

      # VERSION holds MAJOR.MINOR. The run number makes each build's tag unique.
      - name: Version
        id: version
        run: echo "version=$(cat VERSION).${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Package
        run: zip -r build.zip scripts README.md LICENSE VERSION

      - uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: build.zip
          retention-days: 30

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: dev
    permissions:
      contents: write   # gh release create needs this
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Release dev build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}   # no checkout, so gh needs the repo name
          TAG: ${{ vars.BUILD_TAG }}-v${{ needs.build.outputs.version }}
          NOTE: ${{ vars.RELEASE_NOTE }}
        run: |
          gh release create "$TAG" build.zip \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "$TAG" \
            --notes "$NOTE

          - Environment: dev
          - BUILD_TAG: ${{ vars.BUILD_TAG }}
          - Commit: $GITHUB_SHA"
